name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EXECUTION_EVENT_SHA: ${{ github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Record execution provenance
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$EXECUTION_EVENT_SHA"
          CHECKED_OUT_SHA="$checked_out_sha" node <<'NODE'
          const fs = require('node:fs');
          const value = {
            event: process.env.EVENT_NAME,
            source_sha: process.env.SOURCE_SHA,
            execution_event_sha: process.env.EXECUTION_EVENT_SHA,
            checked_out_sha: process.env.CHECKED_OUT_SHA,
            base_sha: process.env.BASE_SHA,
            pull_request: process.env.PR_HEAD_SHA ? {
              base_sha: process.env.PR_BASE_SHA,
              head_sha: process.env.PR_HEAD_SHA,
            } : null,
          };
          fs.writeFileSync('profile-drift-provenance.json', `${JSON.stringify(value, null, 2)}\n`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check CI action pins
        run: pnpm test:ci-hygiene

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Test profile drift classifier
        run: pnpm test:profile-drift

      - name: Build package
        run: pnpm build

      - name: Verify generated Action bundle is committed
        run: git diff --exit-code

      - name: CLI smoke test
        run: >-
          node dist/cli.js verify
          --receipt fixtures/valid/complete-clean.json
          --artifact fixtures/artifacts/current-artifact.bin
          --policy permissive
          --now 2026-08-25T00:00:00Z

      - name: Check live upstream profile drift
        id: profile_drift
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/profile-drift-sentinel.mjs --output profile-drift-report.json

      - name: Upload profile drift evidence
        if: steps.profile_drift.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-drift-source-${{ env.SOURCE_SHA }}-exec-${{ env.EXECUTION_EVENT_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: |
            profile-drift-report.json
            profile-drift-provenance.json

      - name: Enforce profile drift result
        if: steps.profile_drift.outcome != 'skipped'
        env:
          DRIFT_OUTCOME: ${{ steps.profile_drift.outcome }}
        run: test "$DRIFT_OUTCOME" = success
