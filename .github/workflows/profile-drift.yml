name: Registry Profile Drift Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  profile-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Check pinned Registry PR profile
        id: sentinel
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/profile-drift-sentinel.mjs --output profile-drift-report.json

      - name: Summarize profile drift result
        if: steps.sentinel.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## Registry Profile Drift Sentinel'
            echo
            echo '```json'
            cat profile-drift-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profile drift evidence
        if: steps.sentinel.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: profile-drift-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: profile-drift-report.json

      - name: Fail closed on contract drift or unknown state
        if: steps.sentinel.outcome != 'skipped'
        env:
          SENTINEL_OUTCOME: ${{ steps.sentinel.outcome }}
        run: test "$SENTINEL_OUTCOME" = success
